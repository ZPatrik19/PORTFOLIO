name: Prompt Engineering Benchmark Lab CI

on:
  push:
    branches: ["main", "develop", "add-prompt-engineering-benchmark-lab"]
    paths:
      - "02_ai_engineer/prompt-engineering-benchmark-lab/**"
      - ".github/workflows/main.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "02_ai_engineer/prompt-engineering-benchmark-lab/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prompt-benchmark-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PROJECT_DIR: "02_ai_engineer/prompt-engineering-benchmark-lab"

jobs:
  quality-and-tests:
    name: Quality, dependencies & tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash
        working-directory: 02_ai_engineer/prompt-engineering-benchmark-lab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            02_ai_engineer/prompt-engineering-benchmark-lab/requirements.txt
            02_ai_engineer/prompt-engineering-benchmark-lab/requirements-dev.txt
            02_ai_engineer/prompt-engineering-benchmark-lab/pyproject.toml

      - name: Install project and CI dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          else
            python -m pip install pytest pytest-cov ruff pip-audit
          fi
          python -m pip install -e . --no-deps

      - name: Dependency consistency
        run: python -m pip check

      - name: Project structure gate
        run: |
          set -euo pipefail
          required=(
            "README.md"
            "README_HU.md"
            "pyproject.toml"
            "requirements.txt"
            "03_src/prompt_benchmark"
            "04_tests"
            "05_scripts/11_ui_app.py"
            "Dockerfile"
            ".gitignore"
          )

          failed=0
          for item in "${required[@]}"; do
            if [ ! -e "$item" ]; then
              echo "::error::Required project item is missing: $item"
              failed=1
            fi
          done
          exit "$failed"

      - name: Python syntax / bytecode check
        run: python -m compileall -q 03_src 04_tests 05_scripts

      - name: Critical Ruff checks
        run: |
          set -euo pipefail

          mapfile -t normal_files < <(
            find 03_src 04_tests 05_scripts               -type f -name "*.py"               ! -name "11_ui_view_en.py"               ! -name "11_ui_view_hu.py"               -print
          )

          ruff check "${normal_files[@]}"             --select E9,F63,F7,F82             --output-format=github

          # These two files receive globals via runpy.run_path(..., init_globals=...).
          # F821 is therefore a known static-analysis false positive for them.
          ruff check             05_scripts/11_ui_view_en.py             05_scripts/11_ui_view_hu.py             --select E9,F63,F7,F82             --ignore F821             --output-format=github

      - name: Full Ruff lint report
        continue-on-error: true
        run: |
          mapfile -t normal_files < <(
            find 03_src 04_tests 05_scripts               -type f -name "*.py"               ! -name "11_ui_view_en.py"               ! -name "11_ui_view_hu.py"               -print
          )

          ruff check "${normal_files[@]}" --output-format=github || true
          ruff check             05_scripts/11_ui_view_en.py             05_scripts/11_ui_view_hu.py             --ignore F821             --output-format=github || true

      - name: Ruff formatting report
        continue-on-error: true
        run: ruff format --check --diff 03_src 04_tests 05_scripts

      - name: Validate Jupyter notebooks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebooks = [
              p for p in Path("02_notebooks").rglob("*.ipynb")
              if ".ipynb_checkpoints" not in p.parts
          ]

          if not notebooks:
              raise SystemExit("No notebooks found.")

          broken = []
          for path in notebooks:
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  if "cells" not in data or "nbformat" not in data:
                      raise ValueError("missing notebook fields")
              except Exception as exc:
                  broken.append((path, exc))

          if broken:
              for path, exc in broken:
                  print(f"ERROR: {path}: {exc}")
              raise SystemExit(1)

          print(f"Validated {len(notebooks)} notebook(s).")
          PY

      - name: Run unit tests
        env:
          PROMPT_BENCHMARK_ROOT: ${{ github.workspace }}/02_ai_engineer/prompt-engineering-benchmark-lab
        run: pytest 04_tests -m unit -ra -q --maxfail=1

      - name: Run integration tests
        env:
          PROMPT_BENCHMARK_ROOT: ${{ github.workspace }}/02_ai_engineer/prompt-engineering-benchmark-lab
        run: pytest 04_tests -m integration -ra -q --maxfail=1

      - name: Run smoke tests
        env:
          PROMPT_BENCHMARK_ROOT: ${{ github.workspace }}/02_ai_engineer/prompt-engineering-benchmark-lab
        run: pytest 04_tests -m smoke -ra -q --maxfail=1

      - name: Full pytest suite with coverage
        env:
          PROMPT_BENCHMARK_ROOT: ${{ github.workspace }}/02_ai_engineer/prompt-engineering-benchmark-lab
        run: |
          set -o pipefail
          pytest 04_tests             -ra             -q             --maxfail=1             --cov=prompt_benchmark             --cov-report=term-missing             --cov-report=xml             | tee pytest.log

      - name: Dependency vulnerability audit
        continue-on-error: true
        run: pip-audit -r requirements.txt

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prompt-benchmark-ci-reports-${{ github.run_number }}
          path: |
            02_ai_engineer/prompt-engineering-benchmark-lab/pytest.log
            02_ai_engineer/prompt-engineering-benchmark-lab/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  container-build:
    name: Container build & smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        shell: bash
        working-directory: 02_ai_engineer/prompt-engineering-benchmark-lab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build container image
        run: docker build --file Dockerfile --tag prompt-engineering-benchmark-lab:ci .

      - name: Start container
        run: |
          docker run -d             --name prompt-benchmark-ci             -p 8501:8501             prompt-engineering-benchmark-lab:ci

      - name: Wait for Streamlit health endpoint
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "Container health check passed."
              exit 0
            fi
            sleep 2
          done

          docker logs prompt-benchmark-ci || true
          exit 1

      - name: Container logs
        if: always()
        run: docker logs prompt-benchmark-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f prompt-benchmark-ci || true
