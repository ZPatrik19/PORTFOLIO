[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-battery-energy-management-rl"
version = "0.1.0"
description = "Educational-to-advanced reinforcement learning project for battery energy management."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "gymnasium>=0.29,<2.0",
  "torch>=2.1",
]

[project.optional-dependencies]
sb3 = ["stable-baselines3>=2.3,<3.0"]
dev = ["pytest>=8.0", "jupyter>=1.0", "ipykernel>=6.29", "nbformat>=5.9", "nbclient>=0.10", "graphviz>=0.20"]
citylearn = ["citylearn>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["03_tests"]
addopts = "-q"
