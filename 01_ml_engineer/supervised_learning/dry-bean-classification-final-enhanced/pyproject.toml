[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dry-bean-classification"
version = "1.0.0"
description = "Production-style multiclass Dry Bean classification portfolio project"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Portfolio project"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "imbalanced-learn>=0.14,<1",
  "xgboost>=3.0,<4",
  "lightgbm>=4.5,<5",
  "catboost>=1.2,<2",
  "matplotlib>=3.8,<4",
  "scipy>=1.11,<2",
  "torch>=2.2,<3",
  "joblib>=1.3,<2",
  "ucimlrepo>=0.0.7,<1",
  "PyYAML>=6,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["03_tests"]
addopts = "-q"
