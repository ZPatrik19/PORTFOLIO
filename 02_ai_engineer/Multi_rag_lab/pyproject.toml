[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-rag-engineering-lab"
version = "0.43.0"
description = "Modular CPU/CUDA Multi-RAG engineering laboratory with Streamlit, FAISS, reranking and evaluation."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "beautifulsoup4>=4.12",
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=5.24",
  "psutil>=5.9",
  "pydantic>=2.7,<3",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "requests>=2.32",
  "huggingface-hub>=0.34",
  "sentence-transformers>=3.0",
  "streamlit>=1.39",
  "torch>=2.4",
]

[project.optional-dependencies]
cpu = ["faiss-cpu>=1.9"]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "build>=1.2", "twine>=5.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_engine*"]
exclude = ["tests*", "data*", "artifacts*", "docs*", "scripts*", "ui*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "gpu: requires a CUDA-capable runtime",
  "performance: lightweight performance/smoke benchmark",
]

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = ["data", "artifacts", ".venv"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
