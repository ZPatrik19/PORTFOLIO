# Pricing used only for estimated cost metrics.
# Free/local providers default to 0.0. If you move a provider to a paid tier,
# replace the values with the exact model pricing used for your benchmark.
# Units: USD per 1,000,000 tokens.

mock:
  input_per_million_tokens: 0.0
  output_per_million_tokens: 0.0
  note: "Offline prompt-sensitivity simulator. Token/latency values are estimated/simulated, not provider measurements."

ollama:
  input_per_million_tokens: 0.0
  output_per_million_tokens: 0.0
  note: "Local inference; no per-token API charge. Electricity/hardware cost is not modeled."

groq:
  input_per_million_tokens: 0.075
  output_per_million_tokens: 0.30
  note: "Reference list-price equivalent for openai/gpt-oss-20b. Actual charge can be $0 while you stay within Groq Free Plan quota."

gemini:
  input_per_million_tokens: 0.30
  output_per_million_tokens: 2.50
  note: "Reference paid-tier equivalent for gemini-3.5-flash-lite. The Gemini Standard Free Tier is free of charge within its limits."


openrouter:
  input_per_million_tokens: 0.0
  output_per_million_tokens: 0.0
  note: "openrouter/free currently routes to zero-priced free models. Availability and limits can change."

openai:
  input_per_million_tokens: 0.0
  output_per_million_tokens: 0.0
  note: "Enter the current price of OPENAI_MODEL before reporting cost metrics."
