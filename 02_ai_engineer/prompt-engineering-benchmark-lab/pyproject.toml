[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-engineering-benchmark-lab"
version = "1.0.0"
description = "Reproducible prompt-engineering benchmark and evaluation lab."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {text = "MIT"}
authors = [{name = "Portfolio Project"}]
dependencies = [
    "packaging>=24.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "pydantic>=2.6",
    "datasets>=2.18",
    "openai>=2.0",
    "groq>=0.30",
    "google-genai>=2.3.0",
    "ollama>=0.4",
    "streamlit>=1.39",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.12",
    "types-PyYAML>=6.0",
    "jupyter>=1.0",
    "setuptools>=75",
    "wheel>=0.44",
]

[project.scripts]
prompt-benchmark = "prompt_benchmark.cli:main"

[tool.setuptools]
package-dir = {"" = "03_src"}

[tool.setuptools.packages.find]
where = ["03_src"]
include = ["prompt_benchmark*"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["02_notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"05_scripts/11_ui_view_*.py" = ["F401", "F811"]

[tool.pytest.ini_options]
testpaths = ["04_tests"]
markers = [
    "unit: fast isolated tests",
    "integration: multi-component tests without paid external services",
    "smoke: end-to-end minimal pipeline checks",
    "external: tests requiring a live external service or credential",
]

[tool.coverage.run]
branch = true
source = ["prompt_benchmark"]
omit = [
    "03_src/prompt_benchmark/ui/*",
    "03_src/prompt_benchmark/evaluation/diagrams.py",
    "03_src/prompt_benchmark/evaluation/plots.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
packages = ["prompt_benchmark"]
mypy_path = "03_src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
