[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "technical-knowledge-intelligence"
version = "1.1.1"
description = "Production-oriented technical knowledge intelligence platform with hybrid RAG, Gemini, tool calling, evaluation, and observability"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Portfolio Project"}]
dependencies = [
    "pydantic>=2.8",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "google-genai>=2.22.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "streamlit>=1.42",
    "plotly>=6.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.12",
    "mypy>=1.15",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "types-requests>=2.32",
]
full = [
    "qdrant-client>=1.19.0",
    "sentence-transformers>=6.0",
    "langchain-core>=1.6,<2",
    "ebooklib>=0.19",
    "graphviz>=0.20",
]

[project.scripts]
tki = "tkip.cli:main"

[tool.pytest.ini_options]
testpaths = ["06_tests"]
pythonpath = [".", "03_pipeline", "06_tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: multi-component offline integration tests",
    "evaluation: deterministic AI/retrieval metric validation",
    "regression: golden behavior regression tests",
    "robustness: hostile/unusual input tests",
    "performance: local latency/performance guardrails",
    "smoke: lightweight application/API smoke tests",
    "live_gemini: explicit opt-in tests that make real Gemini API calls and consume quota",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".venv",
    "01_data",
    "07_results",
    "08_logs",
    "02_notebooks",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["02_notebooks", "01_data", "07_results"]

[[tool.mypy.overrides]]
module = [
    "qdrant_client",
    "langchain_core.*",
    "ebooklib",
    "sentence_transformers",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tkip.langchain_adapter",
    "tkip.parsing",
    "tkip.figures",
    "tkip.multimodal",
    "tkip.gemini_service",
    "tkip.orchestration",
]
ignore_errors = true
