name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and developer tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev]' --no-build-isolation

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Static type check
        run: python -m mypy 03_pipeline/tkip

      - name: Offline tests with branch coverage
        run: |
          python -m pytest 06_tests -m "not live_gemini" \
            --cov=03_pipeline/tkip --cov-branch \
            --cov-report=term-missing --cov-report=xml

      - name: Release audit
        run: python 05_scripts/release_audit.py
