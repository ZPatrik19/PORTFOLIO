[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-travel-research-assistant"
version = "1.8.0"
description = "A measurable tool-calling AI assistant portfolio project with OpenAI Responses API and an offline deterministic benchmark mode."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.100.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "matplotlib>=3.8.0",
  "scikit-learn>=1.4.0",
  "joblib>=1.3.0",
  "pandas>=2.2.0",
  "streamlit>=1.63.0,<2",
  "plotly>=6.0.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "jupyterlab>=4.0", "nbformat>=5.10"]

[project.scripts]
travel-agent = "travel_agent.cli:main"
travel-agent-eval = "travel_agent.evaluation.runner:main"

[tool.setuptools.packages.find]
where = ["03_src"]

[tool.pytest.ini_options]
pythonpath = ["03_src"]
testpaths = ["05_tests"]
addopts = "-q"
